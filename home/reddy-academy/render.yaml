services:
  - type: web
    name: reddy-academy
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this manually in Render dashboard
      - key: SECRET_KEY
        sync: false          # Set this manually in Render dashboard
      - key: ENVIRONMENT
        value: production
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_TTL_HOURS
        value: 8
      - key: FRONTEND_ORIGIN
        sync: false          # Set to your Render URL e.g. https://reddy-academy.onrender.com
      - key: PRIVACY_NOTICE_VERSION
        value: "2026-01"
